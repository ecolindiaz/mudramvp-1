version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    
    image: mudra-app:dev
    container_name: mudra-app-dev
    
    user: node
    
    env_file:
      - .env.docker
    
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=3000
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PRIVATE_DEBUG_CACHE=false
      - NODE_OPTIONS=--max-old-space-size=7168
      - FORCE_COLOR=1
      - DISABLE_FILE_WATCHING=false
      - WATCHPACK_WATCHER_LIMIT=20
    
    ports:
      - "3000:3000"
      - "9229:9229"
    
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: delegated
      - /app/node_modules
      - /app/.next
      - prisma-client:/app/node_modules/.prisma
    
    restart: on-failure
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 6G
    
    # FIXED: Use wget instead of curl (wget is pre-installed in Alpine)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - mudra-dev-network
    
    labels:
      - "com.mudra.environment=development"
      - "com.mudra.service=app"
    
    stdin_open: true
    tty: true

volumes:
  prisma-client:
    driver: local

networks:
  mudra-dev-network:
    driver: bridge